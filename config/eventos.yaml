# Eventos que entram como marcas no gráfico do preço e nas Mudanças estruturais do relatório.
# Desdobramentos e grupamentos vêm dos dados de preço; não precisam estar aqui.
# A cada rodada, a pesquisa na web (feita pelo Claude na sessão) acrescenta as mudanças dos últimos 24 meses
# e as já aprovadas, em saida/ultima_rodada/<TICKER>/mudancas_estruturais.json. Aqui ficam os eventos estáveis.
#
# Formato:
# - data: "AAAA-MM-DD"
#   titulo: "..."
#   tipo: tributario | contabil | regulatorio | controle | estatal | outro
#   setores: [bancos]          # ou [todos]
#   ativos: [BBAS3]            # opcional
#   efeito_esperado: positivo | negativo | incerto
#   fonte: "URL"
#   canais: [lucro_12m]        # opcional: preditores por onde a mudança age (para "o modelo capta?")
