# Catálogo das séries de macro, exterior e setor.
#
# defasagem: quando o dado de uma data de referência passa a ser conhecido.
#   {dias: N}  séries diárias: o valor do dia d entra em d + N dias
#   {meses: N} séries mensais: o valor do mês m entra no fim do mês m + N (conservador)
# transformacao: nivel | var12m (variação em 12 meses) | acum12m (acumula variações mensais em %)
# revisada: a fonte revisa valores passados e não guarda a versão da época (dito em Limitações)
# explicacao: frase simples usada no relatório

# ---------------- Macro Brasil ----------------
